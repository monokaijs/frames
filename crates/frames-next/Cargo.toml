[package]
name = "frames-next"
description = "Frames v2 binary: the v2 media engine over frames-net with the platform backends"
version.workspace = true
edition.workspace = true
# frames-net (iroh 1.4) requires 1.91.
rust-version = "1.91"
publish = false

# Layering (scripts/check_layers.py): the application layer; it may use every
# v2 crate. It never depends on the v1 crates directly.
[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
directories = "6"
frames-input = { path = "../frames-input" }
frames-clipboard = { path = "../frames-clipboard" }
frames-audio = { path = "../frames-audio" }
frames-media = { path = "../frames-media" }
# Transitional: v1 identity and trust store, for migrating trust (Phase 4).
frames-core = { path = "../frames-core" }
frames-devices = { path = "../frames-devices" }
frames-net = { path = "../frames-net" }
iroh = "=1.4.1"
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
# Access password: PBKDF2-derived key, HMAC proof bound to the session.
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Device card previews (PNG thumbnails).
image = { version = "0.25", default-features = false, features = ["png"] }
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
frames-codec = { path = "../frames-codec" }
frames-platform-windows = { path = "../frames-platform-windows" }
windows = { workspace = true, features = ["Win32_UI_Controls", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell_Common"] }
# The `implement` macro (file drag sources) expands to `windows_core` paths.
windows-core = "0.62.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
frames-platform-macos = { path = "../frames-platform-macos" }

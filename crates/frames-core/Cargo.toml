[package]
name = "frames-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
hex = "0.4"
directories = "6"
fs2 = "0.4"
mdns-sd = "0.17"
opus = "0.4"
socket2 = "0.6"
reed-solomon-simd = "=3.1.0"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_JobObjects"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[features]
# End-to-end test seam (scripts/e2e_matrix.py), never enabled in releases:
# with FRAMES_TEST_IDENTITY_FILE=1 and FRAMES_CONFIG_DIR set, a macOS identity
# key lives in a 0600 file in that throwaway folder instead of the login
# Keychain, which automation contexts without a GUI security session cannot use.
test-identity-file = []

[package]
name = "frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
frames-core = { path = "../frames-core" }
frames-native = { path = "../frames-native" }
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
slint = { version = "=1.13.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = ["Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_StationsAndDesktops"] }

[dev-dependencies]
png = "0.17"

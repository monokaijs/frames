[package]
name = "frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
frames-next = { path = "../frames-next" }
frames-core = { path = "../frames-core" }
frames-native = { path = "../frames-native" }
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ed25519-dalek = "2.2"
hex = "0.4"
semver = "1"
fs2 = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
slint = { version = "=1.16.1", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.16.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = ["Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }

[features]
# See frames-core's feature of the same name. Only for end-to-end test builds.
test-identity-file = ["frames-core/test-identity-file"]

[dev-dependencies]
png = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
socket2 = "0.6"

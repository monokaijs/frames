[package]
name = "frames-devices"
description = "Device forwarding for Frames: gamepads (SDL3 on the viewer, ViGEmBus on a Windows host) and USB/IP between Windows computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Layering (scripts/check_layers.py): no Frames crates; builds SDL3 from
# source (CMake).
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "=0.1.4", features = ["unstable_xtarget_notification"] }
windows.workspace = true

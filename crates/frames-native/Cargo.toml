[package]
name = "frames-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
frames-core = { path = "../frames-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
tracing.workspace = true
sha2.workspace = true
uuid.workspace = true
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }

[features]
media-diagnostics = []

[[example]]
name = "presentation_probe"
required-features = ["media-diagnostics"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Menu bar item (macos_tray.rs). Same versions Slint's winit backend already uses.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSGraphics"] }

[target.'cfg(windows)'.dependencies]
resvg = { version = "=0.45.1", default-features = false }
vigem-client = { version = "=0.1.4", features = ["unstable_xtarget_notification"] }
windows-core = "0.62.2"
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D_Fxc", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_UI_Controls"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

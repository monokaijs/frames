[package]
name = "frames-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
frames-core = { path = "../frames-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
tracing.workspace = true
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D_Fxc", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell_Common"] }

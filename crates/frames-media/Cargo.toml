[package]
name = "frames-media"
description = "Frames v2 real-time media engine: wire format, pipeline traits, recovery and rate control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Layering (scripts/check_layers.py): may depend on frames-proto only, and on
# nothing that needs a C toolchain, so the engine and netsim build anywhere.
# Codec, capture, and presentation backends implement the `api` traits in
# frames-codec / frames-platform-* and depend on this crate, not the reverse.
[dependencies]
bytes.workspace = true

name: Frames
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: choco install ffmpeg -y --no-progress
      - name: Real software codec roundtrip
        run: cargo test -p frames-core --test media_roundtrip --locked -- --ignored --nocapture
      - name: Generated Opus audio roundtrip
        run: cargo test -p frames-core --test audio_roundtrip --locked -- --ignored --nocapture
      - run: ./scripts/build.ps1 -Target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-Windows-x64-unsigned
          path: dist/windows/
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo test --workspace --locked
      - name: Signing identity regression checks
        run: python3 native/macos/Tests/SigningTests.py
      - run: bash native/macos/build.sh
      - name: Mac modifier routing regression checks
        run: |
          swiftc native/macos/Sources/KeyboardModifiers.swift native/macos/Tests/KeyboardModifierTests.swift -o /tmp/frames-keyboard-tests
          /tmp/frames-keyboard-tests
      - name: Mac content geometry regression checks
        run: |
          swiftc native/macos/Sources/WindowContent.swift native/macos/Tests/WindowContentTests.swift -o /tmp/frames-content-tests
          /tmp/frames-content-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Frames-macOS-Apple-silicon-unsigned
          path: dist/macos/

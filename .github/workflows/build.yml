name: Frames
on:
  # Work lands directly on main; run the same checks there, not only on PRs.
  push:
    branches: [main]
    paths-ignore: ["**.md", "spikes/**"]
  pull_request:
    paths-ignore: ["**.md", "spikes/**"]
  workflow_dispatch:
permissions:
  contents: read
  # Deletes superseded dependency caches so the repository's 10 GB cache
  # allowance holds one entry per platform instead of evicting the live one.
  actions: write
env:
  # No debug info in CI builds: smaller dependency caches and faster builds.
  # release.yml sets the same value so its jobs reuse these caches.
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  v2-core:
    # Phase 1 gate: the v2 protocol, media engine, and test kit build and
    # pass on Linux with no C toolchain or media SDK.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: v2-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: v2 crate layering
        run: python3 scripts/check_layers.py
      - name: v2 crates lint and test
        run: |
          cargo clippy -p frames-proto -p frames-media -p frames-testkit --all-targets --locked -- -D warnings
          cargo test --release -p frames-proto -p frames-media -p frames-testkit --locked
      - name: Delete superseded dependency caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_caches.sh v0-rust-v2-core
  windows:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare bundled media SDK
        run: python scripts/prepare_media.py
      - run: cargo fmt --all --check
      - name: Game compatibility catalog documentation
        run: python scripts/game_compatibility.py --check
      - name: Build and exercise shared input adapter
        run: |
          python scripts/build_shared_input.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --buffered
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --hidden-raw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --buffered --hidden-raw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_lifecycle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & target/shared-input/native/Release/shared_ipc_fixture.exe
      - run: python scripts/test_release.py -k executable
      - run: python scripts/test_media_network_fixture.py
      - run: cargo test --workspace --locked -- --nocapture
        timeout-minutes: 20
      - name: Shared game production input session and network lease
        run: |
          cargo build -p frames --bin frames --example shared_probe --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --input-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --network-loss --input-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --picker --input-only
      - name: Host-selected window identity and privacy guards
        run: |
          cargo test -p frames-native window_selection::tests::selected_windows_reject --locked -- --include-ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p frames-native window_selection::tests::one_window_picker --locked -- --include-ignored --nocapture
      # --all-features as in release.yml, which skips its copy of this check
      # when this workflow passed for the commit being released.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Real software codec roundtrip
        run: cargo test -p frames-core --test media_roundtrip --locked -- --nocapture
      - name: Generated Opus audio roundtrip
        run: cargo test -p frames-core --test audio_roundtrip --locked -- --nocapture
      - run: ./scripts/build.ps1 -Target x86_64-pc-windows-msvc
      - run: ./scripts/test_windows_installer.ps1
      - name: Delete superseded dependency caches
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_caches.sh v0-rust-windows
  macos:
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore bundled media SDK
        id: media-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .media-runtime/macos
            .media-runtime/macos-deps
          key: media-macos-${{ hashFiles('scripts/prepare_media_macos.sh', 'scripts/prepare_media_macos_deps.py') }}
      - name: Codec source download regression checks
        run: python scripts/test_prepare_media_macos_deps.py
      - run: python3 scripts/test_media_network_fixture.py
      - name: Prepare bundled media SDK
        run: bash scripts/prepare_media_macos.sh
      - name: Save bundled media SDK
        if: github.ref == 'refs/heads/main' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .media-runtime/macos
            .media-runtime/macos-deps
          key: ${{ steps.media-cache.outputs.cache-primary-key }}
      - run: cargo test --workspace --locked -- --nocapture
        timeout-minutes: 20
      - name: Signing identity regression checks
        run: python3 native/macos/Tests/SigningTests.py
      - run: bash native/macos/build.sh
        env:
          FRAMES_SIGN_IDENTITY: '-'
      - name: Verify macOS installer
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 scripts/release.py package macos-aarch64 "$version"
          python3 scripts/release.py dmg "$version"
          python3 scripts/release.py verify-dmg "dist/release/Frames-$version-macos-aarch64.dmg" "$version"
      - name: Mac modifier routing regression checks
        run: |
          swiftc native/macos/Sources/KeyboardModifiers.swift native/macos/Tests/KeyboardModifierTests.swift -o /tmp/frames-keyboard-tests
          /tmp/frames-keyboard-tests
      - name: Mac content geometry regression checks
        run: |
          swiftc native/macos/Sources/WindowContent.swift native/macos/Tests/WindowContentTests.swift -o /tmp/frames-content-tests
          /tmp/frames-content-tests
      - name: Mac remote header toggle regression checks
        run: |
          sources=()
          for source in native/macos/Sources/*.swift; do
            if [[ "$source" != */main.swift ]]; then sources+=("$source"); fi
          done
          swiftc -swift-version 5 -target arm64-apple-macos14.2 -import-objc-header native/include/frames.h "${sources[@]}" native/macos/Tests/RemoteHeaderTests.swift target/aarch64-apple-darwin/release/libframes_core.a -framework AppKit -framework ScreenCaptureKit -framework Metal -framework QuartzCore -framework VideoToolbox -framework Security -framework CoreGraphics -framework ServiceManagement -framework UniformTypeIdentifiers -framework AudioToolbox -o /tmp/frames-remote-header-tests
          /tmp/frames-remote-header-tests
      - name: Mac dialog and popup behavior regression checks
        run: bash scripts/test_macos_window_surfaces.sh
      - name: Mac shared game viewer policy and virtual cursor
        run: |
          sources=()
          for source in native/macos/Sources/*.swift; do
            if [[ "$source" != */main.swift ]]; then sources+=("$source"); fi
          done
          swiftc -swift-version 5 -target arm64-apple-macos14.2 -import-objc-header native/include/frames.h "${sources[@]}" native/macos/Tests/SharedGameTests.swift target/aarch64-apple-darwin/release/libframes_core.a -framework AppKit -framework ScreenCaptureKit -framework Metal -framework QuartzCore -framework VideoToolbox -framework Security -framework CoreGraphics -framework ServiceManagement -framework UniformTypeIdentifiers -framework AudioToolbox -framework ImageIO -o /tmp/frames-shared-game-tests
          /tmp/frames-shared-game-tests
      - name: Mac control remains responsive when media is blocked
        run: |
          swiftc native/macos/Sources/Wire.swift native/macos/Tests/BridgeOutputTests.swift -framework AppKit -framework ScreenCaptureKit -framework ServiceManagement -o /tmp/frames-bridge-output-tests
          /tmp/frames-bridge-output-tests
      - name: Mac binary client video and latest-frame delivery
        run: |
          swiftc native/macos/Sources/ClientMedia.swift native/macos/Tests/ClientMediaTests.swift -o /tmp/frames-client-media-tests
          /tmp/frames-client-media-tests
      - name: Mac native compressed video and hardware surfaces
        run: |
          swiftc -O -swift-version 5 native/macos/Sources/Wire.swift native/macos/Sources/ClientMedia.swift native/macos/Sources/NativeVideo.swift native/macos/Tests/NativeVideoTests.swift -o /tmp/frames-native-video-tests
          /tmp/frames-native-video-tests
      - name: Mac locked session control checks
        run: |
          swiftc native/macos/Sources/SessionState.swift native/macos/Tests/SessionStateTests.swift -o /tmp/frames-session-state-tests
          /tmp/frames-session-state-tests
      - name: Delete superseded dependency caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_caches.sh v0-rust-macos

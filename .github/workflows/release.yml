name: Release
run-name: Release (${{ inputs.bump }})
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  # Reads the CI result for the commit being released.
  actions: read
env:
  # Same as build.yml, so release jobs restore the dependency caches CI saved.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ci_run: ${{ steps.ci.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # CI (build.yml) runs every regression check on each push to main. When
      # it ran for this commit, the release skips its copies of those checks,
      # builds at once, and ci-gate holds publishing until CI has passed.
      - name: Find CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r run conclusion < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")] | sort_by(.created_at) | last | "\(.id // "none") \(.conclusion // "pending")"')
          [ "$run" = none ] && run=""
          if [ "$conclusion" = failure ] || [ "$conclusion" = timed_out ]; then
            echo "::error::CI failed for $GITHUB_SHA (run $run); fix it before releasing"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "CI run for this commit: ${run:-none, running the checks in this release}"
      - name: Prepare draft
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          version=$(python scripts/release.py next "$BUMP")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Frames $version" --generate-notes

  ci-gate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for CI on this commit
        if: needs.prepare.outputs.ci_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run watch "${{ needs.prepare.outputs.ci_run }}" --exit-status --interval 30 > /dev/null

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      checksums: ${{ steps.package.outputs.checksums }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      # Before set-version, so the key matches the cache CI saved for main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false
      - name: Set version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py set-version $env:RELEASE_VERSION
      - name: Packaging regression checks
        run: python scripts/test_release.py -k executable
      - name: Prepare bundled media SDK
        run: python scripts/prepare_media.py
      - run: cargo fmt --all --check
        if: needs.prepare.outputs.ci_run == ''
      - name: Game compatibility catalog documentation
        if: needs.prepare.outputs.ci_run == ''
        run: python scripts/game_compatibility.py --check
      - name: Shared input adapter regression checks
        if: needs.prepare.outputs.ci_run == ''
        run: |
          python scripts/build_shared_input.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --buffered
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --hidden-raw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_input.py --buffered --hidden-raw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_lifecycle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & target/shared-input/native/Release/shared_ipc_fixture.exe
      - run: cargo test --workspace --locked -- --nocapture
        if: needs.prepare.outputs.ci_run == ''
        timeout-minutes: 20
      - name: Shared game production input session and network lease
        if: needs.prepare.outputs.ci_run == ''
        run: |
          cargo build -p frames --bin frames --example shared_probe --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --input-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --network-loss --input-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_shared_session.py --picker --input-only
      - name: Host-selected window identity and privacy guards
        if: needs.prepare.outputs.ci_run == ''
        run: |
          cargo test -p frames-native window_selection::tests::selected_windows_reject --locked -- --include-ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p frames-native window_selection::tests::one_window_picker --locked -- --include-ignored --nocapture
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: needs.prepare.outputs.ci_run == ''
      - name: Codec and audio checks
        if: needs.prepare.outputs.ci_run == ''
        run: |
          cargo test -p frames-core --locked --test media_roundtrip -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p frames-core --locked --test audio_roundtrip -- --nocapture
      - name: Build release
        env:
          FRAMES_RELEASE_BUILD: '1'
        run: ./scripts/build.ps1 -Target x86_64-pc-windows-msvc
      - name: Verify Windows installation and upgrade
        run: ./scripts/test_windows_installer.ps1
      - name: Package and upload to draft
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python scripts/release.py package windows-x86_64 $env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release.py windows-installer $env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The installer is the download; the ZIP is the package every installed
          # copy's updater requires (update.rs validate_asset). Checksums travel
          # to the publish job as an output and into the release notes.
          $v = $env:RELEASE_VERSION
          gh release upload $env:RELEASE_TAG "dist/release/Frames-$v-windows-x86_64-setup.exe" "dist/release/Frames-$v-windows-x86_64.zip" --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sums = (Get-Content "dist/release/Frames-$v-windows-x86_64-setup.exe.sha256", "dist/release/Frames-$v-windows-x86_64.zip.sha256") -join ';'
          "checksums=$sums" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      checksums: ${{ steps.upload.outputs.checksums }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-darwin
      # Before set-version, so the key matches the cache CI saved for main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: false
      - name: Restore bundled media SDK
        uses: actions/cache/restore@v4
        with:
          path: |
            .media-runtime/macos
            .media-runtime/macos-deps
          key: media-macos-${{ hashFiles('scripts/prepare_media_macos.sh', 'scripts/prepare_media_macos_deps.py') }}
      - name: Set version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py set-version "$RELEASE_VERSION"
      - name: Configure Ed25519 signing tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          python scripts/test_release.py
      - name: Codec source download regression checks
        if: needs.prepare.outputs.ci_run == ''
        run: python scripts/test_prepare_media_macos_deps.py
      - name: Prepare bundled media SDK
        run: bash scripts/prepare_media_macos.sh
      - run: cargo test --workspace --locked -- --nocapture
        if: needs.prepare.outputs.ci_run == ''
        timeout-minutes: 20
      - name: Swift checks
        if: needs.prepare.outputs.ci_run == ''
        run: |
          set -euo pipefail
          python native/macos/Tests/SigningTests.py
          swiftc native/macos/Sources/KeyboardModifiers.swift native/macos/Tests/KeyboardModifierTests.swift -o "$RUNNER_TEMP/keyboard-tests"
          "$RUNNER_TEMP/keyboard-tests"
          swiftc native/macos/Sources/WindowContent.swift native/macos/Tests/WindowContentTests.swift -o "$RUNNER_TEMP/content-tests"
          "$RUNNER_TEMP/content-tests"
          swiftc native/macos/Sources/ClientMedia.swift native/macos/Tests/ClientMediaTests.swift -o "$RUNNER_TEMP/media-tests"
          "$RUNNER_TEMP/media-tests"
          swiftc native/macos/Sources/SessionState.swift native/macos/Tests/SessionStateTests.swift -o "$RUNNER_TEMP/session-tests"
          "$RUNNER_TEMP/session-tests"
          swiftc native/macos/Sources/Wire.swift native/macos/Tests/BridgeOutputTests.swift -framework AppKit -framework ScreenCaptureKit -framework ServiceManagement -o "$RUNNER_TEMP/bridge-tests"
          "$RUNNER_TEMP/bridge-tests"
      - name: Native compressed video, text quality, and source backpressure
        if: needs.prepare.outputs.ci_run == ''
        run: |
          set -euo pipefail
          swiftc -O -swift-version 5 native/macos/Sources/Wire.swift native/macos/Sources/ClientMedia.swift native/macos/Sources/NativeVideo.swift native/macos/Tests/NativeVideoTests.swift -o "$RUNNER_TEMP/native-video-tests"
          "$RUNNER_TEMP/native-video-tests"
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/frames-signing.keychain-db"
          security set-keychain-settings -lut 7200 "$RUNNER_TEMP/frames-signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/frames-signing.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$RUNNER_TEMP/frames-signing.keychain-db" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$RUNNER_TEMP/frames-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/frames-signing.keychain-db" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
      - name: Build and sign
        env:
          FRAMES_RELEASE_BUILD: '1'
          FRAMES_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: bash native/macos/build.sh
      - name: Mac dialog and popup behavior regression checks
        if: needs.prepare.outputs.ci_run == ''
        run: bash scripts/test_macos_window_surfaces.sh
      - name: Shared game macOS viewer regression checks
        if: needs.prepare.outputs.ci_run == ''
        run: |
          set -euo pipefail
          sources=()
          for source in native/macos/Sources/*.swift; do
            if [[ "$source" != */main.swift ]]; then sources+=("$source"); fi
          done
          swiftc -swift-version 5 -target arm64-apple-macos14.2 -import-objc-header native/include/frames.h "${sources[@]}" native/macos/Tests/SharedGameTests.swift target/aarch64-apple-darwin/release/libframes_core.a -framework AppKit -framework ScreenCaptureKit -framework Metal -framework QuartzCore -framework VideoToolbox -framework Security -framework CoreGraphics -framework ServiceManagement -framework UniformTypeIdentifiers -framework AudioToolbox -framework ImageIO -o "$RUNNER_TEMP/shared-game-tests"
          "$RUNNER_TEMP/shared-game-tests"
      - name: Verify signed macOS updater replacement and rejection
        env:
          FRAMES_UPDATE_TEST_APP: ${{ github.workspace }}/dist/macos/Frames.app
        run: |
          cargo test -p frames update::tests:: --locked -- --include-ignored --nocapture
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          FRAMES_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          python scripts/release.py package macos-aarch64 "$RELEASE_VERSION"
          archive="dist/release/Frames-$RELEASE_VERSION-macos-aarch64.zip"
          xcrun notarytool submit "$archive" --key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 10m --output-format json > "$RUNNER_TEMP/notary-result.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/notary-result.json")); print("Notarization:",d["status"]); assert d["status"]=="Accepted"'
          python scripts/release.py staple dist/macos/Frames.app
          spctl --assess --type execute --verbose=2 dist/macos/Frames.app
          python scripts/release.py package macos-aarch64 "$RELEASE_VERSION"
          python -m pip install --quiet dmgbuild==1.6.7
          python scripts/release.py dmg "$RELEASE_VERSION"
          image="dist/release/Frames-$RELEASE_VERSION-macos-aarch64.dmg"
          source native/macos/sign.sh
          identity="$(frames_signing_identity dist/macos/Frames.app)"
          codesign --force --sign "$identity" --timestamp "$image"
          xcrun notarytool submit "$image" --key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 10m --output-format json > "$RUNNER_TEMP/notary-result.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/notary-result.json")); print("Installer notarization:",d["status"]); assert d["status"]=="Accepted"'
          python scripts/release.py staple "$image"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
          python scripts/release.py verify-dmg "$image" "$RELEASE_VERSION"
          (cd dist/release && shasum -a 256 "Frames-$RELEASE_VERSION-macos-aarch64.dmg" > "Frames-$RELEASE_VERSION-macos-aarch64.dmg.sha256")
      - name: Remote header regression checks
        if: needs.prepare.outputs.ci_run == ''
        run: |
          sources=()
          for source in native/macos/Sources/*.swift; do
            if [[ "$source" != */main.swift ]]; then sources+=("$source"); fi
          done
          swiftc -swift-version 5 -target arm64-apple-macos14.2 -import-objc-header native/include/frames.h "${sources[@]}" native/macos/Tests/RemoteHeaderTests.swift target/aarch64-apple-darwin/release/libframes_core.a -framework AppKit -framework ScreenCaptureKit -framework Metal -framework QuartzCore -framework VideoToolbox -framework Security -framework CoreGraphics -framework ServiceManagement -framework UniformTypeIdentifiers -framework AudioToolbox -o "$RUNNER_TEMP/header-tests"
          "$RUNNER_TEMP/header-tests"
      - name: Upload signed package to draft
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # The DMG is the download; the ZIP is the package every installed
          # copy's updater requires (update.rs validate_asset).
          base="dist/release/Frames-$RELEASE_VERSION-macos-aarch64"
          gh release upload "$RELEASE_TAG" "$base.dmg" "$base.zip" --clobber
          echo "checksums=$(cat "$base.dmg.sha256" "$base.zip.sha256" | paste -sd ';' -)" >> "$GITHUB_OUTPUT"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/frames-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/notary-result.json"

  publish:
    needs: [prepare, ci-gate, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify packages and sign update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_CHECKSUMS: ${{ needs.windows.outputs.checksums }}
          MACOS_CHECKSUMS: ${{ needs.macos.outputs.checksums }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" --dir dist/release
          # Checksums from the jobs that built the packages, not from the draft.
          printf '%s;%s' "$WINDOWS_CHECKSUMS" "$MACOS_CHECKSUMS" | tr ';' '\n' | sed '/^$/d' > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          (cd dist/release && sha256sum --check ../../SHA256SUMS)
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$RUNNER_TEMP/update-key.pem"' EXIT
          python scripts/release.py manifest "$RELEASE_VERSION" dist/release "$RUNNER_TEMP/update-key.pem"
          gh release upload "$RELEASE_TAG" dist/release/update.json dist/release/update.json.sig --clobber
          # Downloads and checksums in the notes, instead of a .sha256 asset per file.
          body=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          if ! grep -q '^### SHA-256' <<<"$body"; then
            {
              printf '%s\n\n' "$body"
              echo '### Downloads'
              echo "- **macOS** (Apple silicon): \`Frames-$RELEASE_VERSION-macos-aarch64.dmg\`"
              echo "- **Windows**: \`Frames-$RELEASE_VERSION-windows-x86_64-setup.exe\`"
              echo
              echo 'The `.zip` files are the packages Frames installs through automatic updates (the Windows ZIP also runs as a portable app); `update.json` is the signed update manifest.'
              echo
              echo '### SHA-256'
              echo '```'
              cat SHA256SUMS
              echo '```'
            } > notes.md
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          fi
      - name: Commit version, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python scripts/release.py set-version "$RELEASE_VERSION"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock native/macos/Info.plist
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest

  cleanup:
    if: always() && needs.prepare.outputs.tag != '' && needs.publish.result != 'success'
    needs: [prepare, ci-gate, windows, macos, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove incomplete draft on failure
        if: needs.publish.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
